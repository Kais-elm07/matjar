# فحص آلي عند كل Pull Request وكل دفع إلى الفرع الرئيسي:
# التنسيق، ESLint، الأنواع، ثم بناء الموقع كاملاً.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: فحص الكود والبناء
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: تثبيت pnpm
        run: npm install -g pnpm@12.16.1

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      - name: فحص التنسيق (Prettier)
        run: pnpm format:check

      - name: فحص الأخطاء (ESLint)
        run: pnpm lint

      - name: فحص الأنواع (TypeScript)
        run: pnpm typecheck

      - name: فحص ملف التصميم (DESIGN.md)
        run: pnpm design:lint

      - name: بناء الموقع الثابت
        run: pnpm build

      - name: حفظ نسخة الموقع الجاهزة
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 7
