# Automatic checks on every pull request and every push to the main branch:
# formatting, ESLint, types, unused code (knip), the design file and unit tests, then a production build,
# then browser tests on the production server (next start) with Chrome, Firefox and Safari (WebKit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only access to the repository, so no step can change it
permissions:
  contents: read

jobs:
  check:
    name: Check code and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A PostgreSQL database for the orders, the same major version as the local one (pnpm db:start)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matjar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/matjar
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Create the database tables (Prisma migrations)
        run: pnpm db:deploy

      - name: Check formatting (Prettier)
        run: pnpm format:check

      - name: Check for errors (ESLint)
        run: pnpm lint

      - name: Check types (TypeScript)
        run: pnpm typecheck

      - name: Check for unused files, exports and packages (knip)
        run: pnpm knip

      - name: Check the design file (DESIGN.md)
        run: pnpm design:lint

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build the site
        run: pnpm build

      # The test browsers are cached between runs by Playwright version, so they aren't downloaded every time
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the test browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install system libraries for the cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Browser tests (Playwright)
        run: pnpm test:e2e

      - name: Save the browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
