# فحص آلي عند كل Pull Request وكل دفع إلى الفرع الرئيسي:
# التنسيق، ESLint، الأنواع، واختبارات الوحدات، ثم بناء الموقع كاملاً،
# ثم اختبارات المتصفح على النسخة المبنية بـ Chrome وFirefox وSafari (WebKit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: فحص الكود والبناء
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: تثبيت pnpm
        run: npm install -g pnpm@12.16.1

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      - name: فحص التنسيق (Prettier)
        run: pnpm format:check

      - name: فحص الأخطاء (ESLint)
        run: pnpm lint

      - name: فحص الأنواع (TypeScript)
        run: pnpm typecheck

      - name: فحص ملف التصميم (DESIGN.md)
        run: pnpm design:lint

      - name: اختبارات الوحدات (Vitest)
        run: pnpm test

      - name: بناء الموقع الثابت
        run: pnpm build

      - name: تثبيت متصفحات الاختبار
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: اختبارات المتصفح (Playwright)
        run: pnpm test:e2e

      - name: حفظ تقرير اختبارات المتصفح عند الفشل
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: حفظ نسخة الموقع الجاهزة
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 7
