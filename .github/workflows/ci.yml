# فحص آلي عند كل Pull Request وكل دفع إلى الفرع الرئيسي:
# التنسيق، ESLint، الأنواع، وملف التصميم، واختبارات الوحدات، ثم بناء الموقع كاملاً،
# ثم اختبارات المتصفح على النسخة المبنية بـ Chrome وFirefox وSafari (WebKit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# قراءة المستودع فقط، فلا يستطيع أي خطوة تعديله
permissions:
  contents: read

jobs:
  check:
    name: فحص الكود والبناء
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      # يقرأ إصدار pnpm من packageManager في package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: تثبيت الحزم
        run: pnpm install --frozen-lockfile

      - name: فحص التنسيق (Prettier)
        run: pnpm format:check

      - name: فحص الأخطاء (ESLint)
        run: pnpm lint

      - name: فحص الأنواع (TypeScript)
        run: pnpm typecheck

      - name: فحص ملف التصميم (DESIGN.md)
        run: pnpm design:lint

      - name: اختبارات الوحدات (Vitest)
        run: pnpm test

      - name: بناء الموقع الثابت
        run: pnpm build

      # متصفحات الاختبار تُحفظ بين التشغيلات حسب إصدار Playwright، فلا تُنزَّل كل مرة
      - name: إصدار Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: تثبيت متصفحات الاختبار
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: تثبيت مكتبات النظام للمتصفحات المحفوظة
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: اختبارات المتصفح (Playwright)
        run: pnpm test:e2e

      - name: حفظ تقرير اختبارات المتصفح عند الفشل
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: حفظ نسخة الموقع الجاهزة
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 7
