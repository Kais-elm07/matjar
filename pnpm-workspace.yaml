# سكربتات البناء التي يُسمح للحزم بتشغيلها أثناء التثبيت (pnpm يرفض أي سكربت غير مذكور هنا).
# false = تجاهل السكربت دون إيقاف التثبيت.
allowBuilds:
  sharp: false
  unrs-resolver: false
  # أداة Prisma تنزّل محرك الترحيل تلقائياً عند أول استخدام، فلا حاجة لتنزيله أثناء التثبيت.
  "@prisma/engines": false
  prisma: false
