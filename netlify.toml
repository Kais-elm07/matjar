# Netlify settings: builds the static site and publishes the out folder.
# The headers are in public/_headers, and the 404 page is taken from out/404.html automatically.
# The real site URL (NEXT_PUBLIC_SITE_URL) is set in the Netlify dashboard:
# Site configuration → Environment variables, so the domain isn't written in the code.

[build]
  command = "pnpm build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
