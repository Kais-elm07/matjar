# Netlify settings: builds the site and runs it as a Next.js server on Netlify's functions.
# The security and caching headers are in next.config.ts, and the server answers unknown pages with the 404 page.
# The real site URL (NEXT_PUBLIC_SITE_URL) and the database address (DATABASE_URL) are set in the Netlify
# dashboard: Site configuration → Environment variables, so neither is written in the code.

# The migrations update the database's tables before the new build goes live,
# so DATABASE_URL must be set for builds too, not only for the functions.
# The Prisma client (src/generated, not in Git) is generated first: Netlify keeps node_modules between
# builds, and pnpm then finds nothing to install and skips the postinstall script that generates it.
# pnpm db:seed fills the catalog from src/data when the database has no products yet (the first deploy),
# and changes nothing after that.
[build]
  command = "pnpm db:generate && pnpm db:deploy && pnpm db:seed && pnpm build"

[build.environment]
  NODE_VERSION = "24"

# Netlify serves the files in public itself, so the Cache-Control for /images in next.config.ts never
# reaches them, and browsers asked again for every photo on every page. The same value is set here:
# one day, because a photo may be replaced under the same name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify's own Next.js integration: it turns the build into the pages, functions and files Netlify serves
[[plugins]]
  package = "@netlify/plugin-nextjs"
